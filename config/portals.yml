# Portal Scanner — jobSearcher
#
# Escanea APIs públicas de Greenhouse/Ashby/Lever sin gastar tokens de LLM.
# Copia este archivo a config/portals.yml y personaliza.
#
# Uso:
#   venv/bin/python -m src.tools.portal_scanner              # scan completo
#   venv/bin/python -m src.tools.portal_scanner --dry-run    # preview

# ─── Filtro de títulos ───────────────────────────────────────────────
# At least 1 positive match AND 0 negatives (case-insensitive).

title_filter:
  positive:
    - "Java"
    - "Spring"
    - "Backend"
    - "Back-end"
    - "Back End"
    - "Full Stack"
    - "Fullstack"
    - "Full-stack"
    - "Software Engineer"
    - "Software Developer"
    - "Senior Engineer"
    - "Staff Engineer"
    - "Platform Engineer"
    - "Cloud Engineer"
    - "Microservices"

  negative:
    - "Intern"
    - "Internship"
    - "Becario"
    - "Junior"
    - "Frontend Only"
    - "iOS"
    - "Android"
    - "Mobile Developer"
    - "Data Scientist"
    - "Data Engineer"
    - "ML Engineer"
    - "Machine Learning"
    - "DevRel"
    - "Sales"
    - "Marketing"
    - "Recruiter"
    - "Designer"
    - "QA Tester"
    - "Game Developer"
    - ".NET"
    - "C#"
    - "PHP"
    - "Ruby on Rails"
    - "Rust"
    - "Golang"
    - "Go Developer"
    - "Embedded"
    - "Firmware"

# ─── Filtro de ubicación ───────────────────────────────────────────
# Solo se guardan jobs que coincidan con al menos 1 location_positive
# O que tengan location_positive en "Remote" (genérico, sin país restrictivo).
# Jobs con ubicaciones que coincidan con location_negative se descartan.

location_filter:
  positive:
    - "Mexico"
    - "México"
    - "Mexico City"
    - "CDMX"
    - "Ciudad de México"
    - "Polanco"
    - "Monterrey"
    - "Guadalajara"
    - "Remote"
    - "Latam"
    - "Remoto"
  negative:
    - "India"
    - "Brazil"
    - "Sao Paulo"
    - "Bengaluru"
    - "Singapore"
    - "China"
    - "Germany"
    - "Romania"
    - "Ireland"
    - "London"
    - "Berlin"
    # EEUU/Canadá — "Remote - US" etc. no contratan en México
    - "United States"
    - "US Only"
    - "US-based"
    - "Remote - US"
    - "Remote, US"
    - "Remote (US"
    - "San Francisco"
    - "New York"
    - "Seattle"
    - "Austin"
    - "Chicago"
    - "Boston"
    - "Los Angeles"
    - "Denver"
    - "Washington"
    - "Atlanta"
    - "Miami"
    - "Canada"
    - "Toronto"
    - "Vancouver"
    # Europa / otros
    - "Poland"
    - "Portugal"
    - "Spain"
    - "Netherlands"
    - "Amsterdam"
    - "Paris"
    - "Dublin"
    - "Tel Aviv"
    - "Tokyo"
    - "Japan"
    - "Australia"
    - "Sydney"
    - "Buenos Aires"
    - "Bogota"
    - "Bogotá"

